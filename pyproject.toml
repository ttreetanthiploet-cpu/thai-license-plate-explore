[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thai_plate_reader"
version = "0.0.0"
description = "Thai licence-plate reader (offline)"
requires-python = ">=3.11"

dependencies = [
  "easyocr==1.7.2",
  "opencv-python-headless==5.0.0.93",
  "numpy==2.3.2",
  "torch==2.14.0",
  "torchvision==0.29.0",
  "pillow==11.3.0",
  "matplotlib==3.10.6",
  "pandas==2.3.2",
  "ipykernel==6.30.1",
]

[project.optional-dependencies]
notebook = [
  "matplotlib==3.10.6",
  "pandas==2.3.2",
  "ipykernel==6.30.1",
]
# + the tesseract program with Thai data (see requirements.txt)
tesseract = ["pytesseract==0.3.13"]
# the paddleocr package is not needed (and would replace the headless OpenCV)
paddle = ["paddlepaddle==3.3.1"]

[tool.setuptools]
py-modules = ["thai_plate_reader", "train_letter_cnn"]
